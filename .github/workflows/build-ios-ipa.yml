name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    # RoboVM 2.3.24 is built for Intel macOS; macOS 26 Intel provides Xcode 26.x
    # and the iPhoneOS 26.x SDK while keeping the RoboVM compiler architecture-compatible.
    runs-on: macos-26-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show Apple and Java toolchains
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          sdk_major=${sdk_version%%.*}
          if [ "$sdk_major" -lt 26 ]; then
            echo "Expected iPhoneOS SDK 26 or newer, found $sdk_version" >&2
            exit 1
          fi
          echo "iPhoneOS SDK: $sdk_version"
          java -version

      - name: Build IPA with RoboVM
        run: |
          set -o pipefail
          ./gradlew ios:createIPA --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/robovm-build.log"

      - name: Upload RoboVM build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robovm-build-log
          path: ${{ runner.temp }}/robovm-build.log
          if-no-files-found: ignore

      - name: Verify and package IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail

          ipa_count=$(find ios/build/robovm -type f -name '*.ipa' -print | wc -l | tr -d ' ')
          if [ "$ipa_count" -ne 1 ]; then
            echo "Expected exactly one IPA under ios/build/robovm, found $ipa_count" >&2
            find ios/build/robovm -type f -name '*.ipa' -print >&2
            exit 1
          fi

          ipa=$(find ios/build/robovm -type f -name '*.ipa' -print -quit)
          inspect_dir="${RUNNER_TEMP}/ipa-inspect"
          rm -rf "$inspect_dir"
          mkdir -p "$inspect_dir" dist
          unzip -q "$ipa" -d "$inspect_dir"

          app_count=$(find "$inspect_dir/Payload" -type d -name '*.app' -print | wc -l | tr -d ' ')
          if [ "$app_count" -ne 1 ]; then
            echo "Expected exactly one app bundle in IPA, found $app_count" >&2
            exit 1
          fi

          app=$(find "$inspect_dir/Payload" -type d -name '*.app' -print -quit)
          test -f "$app/Info.plist"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          vi_count=$(find "$app" -type f -name '*_vi.properties' | wc -l | tr -d ' ')
          test "$vi_count" -eq 9

          cp "$ipa" dist/ShatteredPixelDungeon-unsigned.ipa
          sha256=$(shasum -a 256 dist/ShatteredPixelDungeon-unsigned.ipa | awk '{print $1}')

          {
            echo "IPA: dist/ShatteredPixelDungeon-unsigned.ipa"
            echo "Bundle ID: $bundle_id"
            echo "Version: $version"
            echo "Vietnamese bundles: $vi_count"
            echo "SHA-256: $sha256"
          } | tee dist/BUILD-INFO.txt >> "$GITHUB_STEP_SUMMARY"

          echo "path=dist/ShatteredPixelDungeon-unsigned.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pixel-dungeon-ios-ipa
          path: |
            ${{ steps.package.outputs.path }}
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
